<section class="experience">
  <h1>Experience</h1>

  <!-- 直接使用 @for 替换掉原本的 div -->
  @for (exp of experiences; track exp.company) {
    <div class="item">
      <h2>{{ exp.company }}</h2>
      <h3>{{ exp.position }}</h3>
      <span>{{ exp.duration }}</span>
      <p>{{ exp.description }}</p>
    </div>
  }
</section>
