<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Content Studio</title><link rel="stylesheet" href="style.css"></head><body><header><b>CONTENT STUDIO</b><div><label>导入 JSON<input id="import" type="file" accept="application/json"></label><button id="preview">前台预览</button><button class="primary" id="export">导出 content.json</button></div></header><main><aside><p>LOCAL EDITOR · 不会发布</p><h1>编辑你的<br>作品集。</h1><p>改动自动保存在这台电脑。导出后把文件替换到 GitHub 的 <code>public/assets/content.json</code>。</p><small id="status">准备就绪</small><p><button id="backup">下载备份</button><button id="restore">还原初始内容</button></p></aside><section id="editor"></section></main><template id="project"><article class="project"><div><b class="number"></b><button class="up">↑</button><button class="down">↓</button><button class="remove">删除</button></div><label>项目名称<input data-key="title"></label><label>类别<input data-key="category"></label><label>项目说明<textarea data-key="description"></textarea></label><label>完整项目介绍<textarea data-key="longDescription"></textarea></label><label>职责<input data-key="role"></label><label>技术栈（以逗号分隔）<input data-key="tools"></label><label>成果（每行一项）<textarea data-key="outcomes"></textarea></label><label>更多图片路径（每行一项）<textarea data-key="gallery"></textarea></label><label>图片路径或网址<input data-key="image"></label><label>项目链接<input data-key="url"></label></article></template><script src="app.js"></script></body></html>
