<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1d22"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.04)"/>
    </linearGradient>
    <linearGradient id="lGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- iOS / Apple Dark Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Minimalist Monogram "L" (Liow Zhi Heng) -->
  <path d="M 50,26 C 54.42,26 58,29.58 58,34 V 80 H 82 C 86.42,80 90,83.58 90,88 C 90,92.42 86.42,96 82,96 H 50 C 45.58,96 42,92.42 42,88 V 34 C 42,29.58 45.58,26 50,26 Z" fill="url(#lGrad)"/>

  <!-- Subtle Accent Dot in Signature Blue -->
  <circle cx="94" cy="34" r="4.5" fill="#38bdf8"/>
</svg>
